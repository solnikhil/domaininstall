name: Demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run audio
      - name: Render a representative frame
        run: npx remotion still DomainInstall out/ci-smoke.png --frame=380
